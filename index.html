<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konversi Gambar ke WebP & PDF</title>
    <!-- Menggunakan Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
    <!-- JSZip & FileSaver untuk fitur Download Semua -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- jsPDF untuk Konversi PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-cyan-50 min-h-screen p-4 md:p-8">
    <div class="max-w-5xl mx-auto bg-white/70 backdrop-blur-xl p-8 rounded-3xl shadow-2xl border border-white/50">
        <div class="text-center mb-10">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-green-100 text-green-700 text-xs font-bold mb-4">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                Super Cepat & Privat 
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 mb-4">WebP & PDF Converter</h1>
            <p class="text-gray-500 text-lg">Konversi banyak foto sekaligus menjadi file WebP, atau jadikan satu dokumen PDF secara berurutan.</p>
        </div>

        <!-- Area Upload (Drag & Drop / Klik) -->
        <div class="flex flex-col items-center justify-center w-full mb-8">
            <label for="file-upload" id="drop-area" class="flex flex-col items-center justify-center w-full h-72 border-2 border-indigo-300 border-dashed rounded-2xl cursor-pointer bg-indigo-50/50 hover:bg-indigo-100/70 hover:border-indigo-400 transition-all duration-300 group shadow-inner">
                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <div class="p-4 bg-white rounded-full shadow-sm mb-4 group-hover:scale-110 transition-transform duration-300">
                        <svg class="w-10 h-10 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                    </div>
                    <p class="mb-2 text-lg text-gray-700"><span class="font-bold text-indigo-600">Klik untuk memilih</span> atau seret banyak foto ke sini</p>
                    <p class="text-sm text-gray-500">Mendukung format PNG, JPG, JPEG, dll.</p>
                </div>
                <!-- Menambahkan property multiple agar bisa memilih banyak file -->
                <input id="file-upload" type="file" class="hidden" multiple accept="image/*" />
            </label>
        </div>

        <!-- Tombol Aksi -->
        <div class="flex flex-col md:flex-row items-center justify-between mb-6 pb-4 border-b border-gray-100 hidden gap-4" id="action-bar">
            <p class="text-gray-600 font-medium font-semibold"><span id="count-label" class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-md">0</span> file siap diproses</p>
            <div class="flex flex-wrap gap-3 justify-center">
                <button id="clear-btn" class="px-4 py-2.5 text-sm font-semibold text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors border border-red-100">
                    Hapus
                </button>
                <button id="download-zip-btn" class="px-5 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 rounded-lg shadow-md hover:shadow-lg transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Simpan ZIP (WebP)
                </button>
                <button id="download-pdf-btn" class="px-5 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 rounded-lg shadow-md hover:shadow-lg transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    Jadikan 1 PDF Berurutan
                </button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden text-center py-8">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
            <p class="text-indigo-600 font-medium mt-3">Sedang memproses gambar, mohon tunggu...</p>
        </div>

        <!-- Wadah List Hasil Gambar -->
        <div id="results" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5">
            <!-- Kartu gambar akan muncul di sini via JavaScript -->
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
